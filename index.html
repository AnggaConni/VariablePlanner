        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up">
                <div className="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-white text-center relative">
                    <button onClick={() => setShowAiConfig(false)} className="absolute top-4 right-4 text-white/70 hover:text-white">
                        <span className="icon">close</span>
                    </button>
                    <span className="icon text-5xl mb-2">smart_toy</span>
                    <h2 className="text-xl font-bold">AI Framework Analyzer</h2>
                    <p className="text-sm text-indigo-100 mt-1">Bring Your Own Key (BYOK)</p>
                </div>
                <div className="p-6">
                    <label className="block text-sm font-semibold text-slate-700 mb-2">Gemini API Key</label>
                    <input type="password" 
                        value={geminiKey} 
                        onChange={(e) => setGeminiKey(e.target.value)}
                        placeholder="AIzaSy..." 
                        className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all mb-6"
                    />
                    <button onClick={handleStartAnalysis}
                        className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition-all flex justify-center items-center gap-2">
                        <span className="icon">auto_awesome</span> Start Analysis
                    </button>
                    <p className="text-xs text-slate-400 text-center mt-4">Kunci API Anda hanya disimpan di browser lokal (Local Storage) dan tidak dikirim ke server manapun selain langsung ke Google.</p>
                </div>
            </div>
        </div>
    )}

    {/* ── MODAL 2: LARGE AI ANALYSIS ── */}
    {showAiAnalysis && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[60] flex items-center justify-center p-4 md:p-8">
            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden animate-fade-in-up">
                
                {/* Header & Pagination Tabs */}
                <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center">
                            <span className="icon">{isAnalyzing ? 'sync' : 'psychology'}</span>
                        </div>
                        <h2 className="font-bold text-slate-800 text-lg">Analysis Report</h2>
                    </div>
                    
                    <div className="flex bg-slate-200/50 p-1 rounded-lg">
                        <button onClick={() => setAiPage(1)} className={`px-4 py-1.5 rounded-md text-sm font-semibold transition-all ${aiPage === 1 ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>Analysis</button>
                        <button onClick={() => setAiPage(2)} className={`px-4 py-1.5 rounded-md text-sm font-semibold transition-all ${aiPage === 2 ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>Mapping</button>
                        <button onClick={() => setAiPage(3)} className={`px-4 py-1.5 rounded-md text-sm font-semibold transition-all ${aiPage === 3 ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>Recommendations</button>
                    </div>

                    <button onClick={() => setShowAiAnalysis(false)} className="text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 p-2 rounded-full transition-all">
                        <span className="icon">close</span>
                    </button>
                </div>

                {/* Content Area */}
                <div className="flex-1 overflow-y-auto p-6 bg-slate-50/50">
                    {isAnalyzing ? (
                        <div className="h-full flex flex-col items-center justify-center text-slate-500">
                            <span className="icon text-6xl animate-spin text-indigo-500 mb-4">progress_activity</span>
                            <p className="font-medium animate-pulse">AI is thinking and analyzing your framework...</p>
                        </div>
                    ) : (
                        <div className="space-y-6">

                            {/* PAGE 1: ANALYSIS (VISUAL DASHBOARD) */}
                            {aiPage === 1 && (
                                <div className="flex flex-col gap-5">
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <h3 className="font-bold text-slate-800 mb-5 flex items-center gap-2 text-lg">
                                            <span className="icon text-indigo-500">analytics</span> Hasil Analisis AI
                                        </h3>
                                        {/* INI KODE MARKDOWN YANG BELUM TERCOPY */}
                                        <div 
                                            className="ai-markdown"
                                            dangerouslySetInnerHTML={{ __html: window.marked ? window.marked.parse(aiAnalysisResult || '') : aiAnalysisResult }}
                                        />
                                    </div>
                                </div>
                            )}

                            {/* PAGE 2: MAPPING (RELATIONSHIP HEALTH) */}
                            {aiPage === 2 && (
                                <div className="flex flex-col gap-4">
                                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                        <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2 text-lg">
                                            <span className="icon text-teal-500">hub</span> Pemetaan Relasi & Topologi
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                            {/* Error Card */}
                                            <div className="p-5 bg-rose-50/80 rounded-2xl border border-rose-200 relative overflow-hidden group hover:bg-rose-100 transition-colors cursor-pointer">
                                                <div className="absolute -right-4 -top-4 text-rose-200/50 group-hover:scale-110 transition-transform"><span className="icon text-8xl">link_off</span></div>
                                                <div className="relative z-10">
                                                    <div className="flex items-center gap-2 text-rose-700 font-black mb-2 text-sm uppercase tracking-wide">
                                                        <span className="icon">error</span> Missing Link
                                                    </div>
                                                    <p className="text-sm text-rose-800 leading-relaxed">Variabel <strong>X2</strong> tidak memiliki jalur menuju variabel manapun (Menggantung). Pertimbangkan untuk menghubungkannya ke variabel Mediasi terdekat.</p>
                                                </div>
                                            </div>

                                            {/* Warning Card */}
                                            <div className="p-5 bg-amber-50/80 rounded-2xl border border-amber-200 relative overflow-hidden group hover:bg-amber-100 transition-colors cursor-pointer">
                                                <div className="absolute -right-4 -top-4 text-amber-200/50 group-hover:scale-110 transition-transform"><span className="icon text-8xl">content_copy</span></div>
                                                <div className="relative z-10">
                                                    <div className="flex items-center gap-2 text-amber-700 font-black mb-2 text-sm uppercase tracking-wide">
                                                        <span className="icon">warning</span> Redundancy
                                                    </div>
                                                    <p className="text-sm text-amber-800 leading-relaxed">Variabel <strong>Niat</strong> dan <strong>Motivasi</strong> memiliki makna teoritis yang tumpang tindih. Gabungkan untuk menyederhanakan kompleksitas kerangka.</p>
                                                </div>
                                            </div>

                                            {/* Info/Strategy Card (Full Width) */}
                                            <div className="p-5 bg-indigo-50/80 rounded-2xl border border-indigo-200 relative overflow-hidden group hover:bg-indigo-100 transition-colors cursor-pointer md:col-span-2 shadow-sm">
                                                <div className="absolute right-0 top-0 text-indigo-200/50 group-hover:scale-110 transition-transform"><span className="icon text-9xl">alt_route</span></div>
                                                <div className="relative z-10">
                                                    <div className="flex items-center gap-2 text-indigo-700 font-black mb-2 text-sm uppercase tracking-wide">
                                                        <span className="icon">psychology</span> Structural Vulnerability
                                                    </div>
                                                    <p className="text-sm text-indigo-800 leading-relaxed max-w-2xl">Model ini memiliki efek "Bottleneck". Sangat bergantung pada variabel <strong>Customer Satisfaction</strong> sebagai satu-satunya perantara menuju ujung akhir. Jika variabel ini gagal tercapai, seluruh dampak arsitektur akan runtuh.</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}


                            {/* PAGE 3: RECOMMENDATIONS & REVISION */}
                            {aiPage === 3 && (
                                <div className="flex flex-col h-full gap-4">
                                    <div className="p-6 bg-indigo-50/50 rounded-2xl border border-indigo-100 flex-1">
                                        <h3 className="font-bold text-xl mb-4 text-indigo-900">Proposed Changes</h3>
                                        <ul className="list-disc list-inside text-indigo-800 space-y-2 mb-6">
                                            <li>Add new node: 'Motivation' as an Intervening variable.</li>
                                            <li>Change edge type between Node 1 and Node 2 to 'Positive Direction'.</li>
                                            <li>Merge Node 3 and Node 4 into a single 'Capability' node.</li>
                                        </ul>
                                        
                                        <div className="flex gap-3 mt-6">
                                            <button onClick={handleApplyRecommendation} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-xl flex-1 transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2">
                                                <span className="icon">check_circle</span> Accept & Apply Structure
                                            </button>
                                        </div>
                                    </div>

                                    {/* Kolom Revisi Prompt */}
                                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-end gap-3">
                                        <div className="flex-1">
                                            <label className="text-xs font-bold text-slate-500 mb-1 block">Ask AI to Revise Strategy</label>
                                            <textarea 
                                                value={aiFeedback}
                                                onChange={(e) => setAiFeedback(e.target.value)}
                                                placeholder="Contoh: Fokuskan rekomendasi pada variabel psikologis, bukan teknis..." 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none h-16"
                                            />
                                        </div>
                                        <button onClick={() => handleStartAnalysis(true)} className="bg-slate-900 hover:bg-slate-800 text-white rounded-xl h-16 px-6 font-bold flex items-center gap-2 transition-all">
                                            <span className="icon">send</span> Revise
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            </div>
        </div>
    )}

    {/* ── MODAL 3: NODE AI RESEARCHER ── */}
    {showNodeAiModal && activeAiNode && (
        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[70] flex items-center justify-center p-4 md:p-6">
            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden animate-fade-in-up border border-emerald-100">
                
                {/* Header Profil Node */}
                <div className="bg-gradient-to-r from-emerald-700 to-teal-800 p-6 text-white shrink-0 relative">
                    <button onClick={() => setShowNodeAiModal(false)} className="absolute top-6 right-6 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-all">
                        <span className="icon">close</span>
                    </button>
                    <div className="flex items-center gap-4">
                        <div className="w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center text-emerald-300 shadow-inner">
                            <span className="icon text-4xl">biotech</span>
                        </div>
                        <div>
                            <div className="text-emerald-200 text-sm font-bold tracking-wider uppercase mb-1 flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 
                                Target Variable Analysis
                            </div>
                            <h2 className="text-3xl font-black drop-shadow-md">{activeAiNode.text || 'Unnamed Variable'}</h2>
                            <span className="inline-block mt-2 px-3 py-1 bg-emerald-900/50 rounded-full text-xs font-semibold border border-emerald-500/30">
                                Type: {activeAiNode.type?.toUpperCase()}
                            </span>
                        </div>
                    </div>
                </div>

                {/* Tabs Navigation */}
                <div className="flex px-6 py-3 border-b border-slate-100 bg-slate-50 gap-2 shrink-0 overflow-x-auto">
                    <button onClick={() => setNodeAiTab('insight')} className={`px-5 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${nodeAiTab === 'insight' ? 'bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-200' : 'text-slate-500 hover:bg-slate-200/50'}`}><span className="icon text-base">summarize</span> Resume & Analisa</button>
                    <button onClick={() => setNodeAiTab('expansion')} className={`px-5 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${nodeAiTab === 'expansion' ? 'bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-200' : 'text-slate-500 hover:bg-slate-200/50'}`}><span className="icon text-base">library_add</span> Ekspansi & Rekomendasi</button>
                    <button onClick={() => setNodeAiTab('literature')} className={`px-5 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${nodeAiTab === 'literature' ? 'bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-200' : 'text-slate-500 hover:bg-slate-200/50'}`}><span className="icon text-base">menu_book</span> Literatur & Media</button>
                </div>

                {/* Content Area */}
                <div className="flex-1 overflow-y-auto bg-slate-50 relative">
                    {isNodeAnalyzing ? (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-50/80 backdrop-blur-sm z-10 text-emerald-700">
                            <span className="icon text-7xl animate-spin mb-4">radar</span>
                            <h3 className="text-xl font-bold">AI is researching across databases...</h3>
                            <p className="text-sm opacity-70 mt-2">Crawling PubMed, Scholar, and generating topological suggestions.</p>
                        </div>
                    ) : (
                        <div className="p-6 h-full">
                            
                            {/* TAB 1: INSIGHT & RESUME */}
                            {nodeAiTab === 'insight' && (
                                <div className="space-y-6 max-w-4xl mx-auto">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                                            <span className="icon text-emerald-500">psychology</span> Laporan Deep Research
                                        </h3>
                                        <div 
                                            className="ai-markdown"
                                            dangerouslySetInnerHTML={{ 
                                                __html: activeAiNode.aiData ? (window.marked ? window.marked.parse(activeAiNode.aiData.insight) : activeAiNode.aiData.insight) : 'Belum ada analisa.' 
                                            }}
                                        />
                                    </div>
                                </div>
                            )}

                            {/* TAB 2: EXPANSION (SEBAB & AKIBAT) */}
                            {nodeAiTab === 'expansion' && (
                                <div className="space-y-8 max-w-5xl mx-auto">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        {/* Kolom Antecedent (Sebab) */}
                                        <div>
                                            <div className="flex items-center gap-2 mb-4">
                                                <span className="icon text-rose-500">arrow_forward</span>
                                                <h3 className="font-bold text-slate-800 text-lg">Prediktor yang Disarankan (Sebab)</h3>
                                            </div>
                                            <div className="space-y-3">
                                                {/* Item Biasa */}
                                                <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm flex items-center justify-between group hover:border-emerald-400 transition-colors">
                                                    <div>
                                                        <div className="font-bold text-slate-700 text-sm">Tekanan Waktu (Time Pressure)</div>
                                                        <div className="text-xs text-slate-400">Variabel: Exogenous</div>
                                                    </div>
                                                    <button onClick={() => handleAddRecommendedNode('exogenous', 'Tekanan Waktu', 'Existing')} className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center hover:bg-emerald-500 hover:text-white transition-colors">
                                                        <span className="icon">add</span>
                                                    </button>
                                                </div>
                                                {/* Item Out of Box (Custom AI) */}
                                                <div className="bg-gradient-to-r from-violet-50 to-fuchsia-50 border border-violet-200 p-4 rounded-xl shadow-sm flex items-center justify-between group hover:border-violet-400 transition-colors relative overflow-hidden">
                                                    <div className="absolute -right-2 -top-2 text-violet-100"><span className="icon text-6xl">auto_awesome</span></div>
                                                    <div className="relative z-10">
                                                        <div className="flex items-center gap-2">
                                                            <div className="font-bold text-slate-800 text-sm">Kapasitas Memori Kerja</div>
                                                            <span className="px-2 py-0.5 bg-violet-600 text-white text-[10px] font-bold rounded-md uppercase tracking-wide">AI Custom</span>
                                                        </div>
                                                        <div className="text-xs text-slate-500 mt-1">Saran variabel baru di luar kamus standar.</div>
                                                    </div>
                                                    <button className="relative z-10 w-8 h-8 rounded-lg bg-violet-200 text-violet-700 flex items-center justify-center hover:bg-violet-600 hover:text-white transition-colors">
                                                        <span className="icon">add</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Kolom Consequent (Akibat) */}
                                        <div>
                                            <div className="flex items-center gap-2 mb-4">
                                                <h3 className="font-bold text-slate-800 text-lg">Dampak Lanjutan (Akibat)</h3>
                                                <span className="icon text-teal-500">arrow_forward</span>
                                            </div>
                                            <div className="space-y-3">
                                                <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm flex items-center justify-between hover:border-teal-400 transition-colors">
                                                    <div>
                                                        <div className="font-bold text-slate-700 text-sm">Kelelahan Kognitif (Burnout)</div>
                                                        <div className="text-xs text-slate-400">Variabel: Dependent / Impact</div>
                                                    </div>
                                                    <button className="w-8 h-8 rounded-lg bg-teal-100 text-teal-600 flex items-center justify-center hover:bg-teal-500 hover:text-white transition-colors">
                                                        <span className="icon">add</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 3: LITERATURE & MEDIA */}
                                {nodeAiTab === 'literature' && activeAiNode.aiData && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-5xl mx-auto">
                                        {/* Kolom Jurnal (Otomatis dari AI) */}
                                        <div className="space-y-4">
                                            <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2 mb-4"><span className="icon text-blue-600">school</span> Academic Citations</h3>
                                            
                                            {/* Scholar Card */}
                                            <a href={`https://scholar.google.com/scholar?q=${encodeURIComponent(activeAiNode.aiData.scholar_paper)}`} target="_blank" rel="noopener noreferrer" className="block bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md hover:border-blue-300 transition-all group">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="px-2 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded flex items-center gap-1"><span className="icon text-xs">search</span> Google Scholar</div>
                                                    <span className="icon text-slate-300 group-hover:text-blue-500">open_in_new</span>
                                                </div>
                                                <div className="font-bold text-blue-600 group-hover:underline text-base leading-snug">{activeAiNode.aiData.scholar_paper}</div>
                                                <p className="text-sm text-slate-500 mt-2">{activeAiNode.aiData.scholar_author}</p>
                                            </a>

                                            {/* PubMed Card */}
                                            <a href={`https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(activeAiNode.aiData.pubmed_paper)}`} target="_blank" rel="noopener noreferrer" className="block bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md hover:border-slate-800 transition-all group">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="px-2 py-1 bg-slate-800 text-white text-xs font-bold rounded flex items-center gap-1"><span className="icon text-xs">health_and_safety</span> PubMed</div>
                                                    <span className="icon text-slate-300 group-hover:text-slate-800">open_in_new</span>
                                                </div>
                                                <div className="font-bold text-slate-700 group-hover:underline text-base leading-snug">{activeAiNode.aiData.pubmed_paper}</div>
                                                <p className="text-sm text-slate-500 mt-2">{activeAiNode.aiData.pubmed_author}</p>
                                            </a>
                                        </div>

                                        {/* Kolom Video / Media (Auto Embed Player) */}
                                        <div>
                                            <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2 mb-4"><span className="icon text-red-500">smart_display</span> Media & Explainer</h3>
                                            
                                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-lg transition-all">
                                                {/* Kotak Iframe Video Youtube */}
                                                <div className="relative w-full aspect-video bg-slate-900 border-b border-slate-200">
                                                    <iframe 
                                                        src={`https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(activeAiNode.aiData.youtube_query)}`}
                                                        title="YouTube video player" 
                                                        frameBorder="0" 
                                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                        allowFullScreen
                                                        className="absolute top-0 left-0 w-full h-full"
                                                    ></iframe>
                                                </div>
                                                <div className="p-4 flex items-center justify-between">
                                                    <div>
                                                        <h4 className="font-bold text-slate-800 text-sm">Top Result: "{activeAiNode.aiData.youtube_query}"</h4>
                                                        <div className="text-xs text-slate-500 mt-1">Video dicari dan dimuat oleh AI.</div>
                                                    </div>
                                                    {/* Tombol Pindah ke Tab Baru YouTube */}
                                                    <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(activeAiNode.aiData.youtube_query)}`} target="_blank" rel="noopener noreferrer" className="w-10 h-10 bg-red-50 text-red-600 rounded-full flex items-center justify-center hover:bg-red-100 transition-colors shrink-0" title="Buka di YouTube">
                                                        <span className="icon">open_in_new</span>
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                        </div>
                    )}
                </div>

                {/* Footer: Interactive Revision Prompt */}
                <div className="bg-white border-t border-slate-200 p-4 shrink-0 flex gap-3">
                    <div className="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                        <span className="icon text-2xl">support_agent</span>
                    </div>
                    <div className="flex-1 flex bg-slate-50 border border-slate-200 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500 focus-within:border-emerald-500 transition-all">
                        <input 
                            type="text" 
                            value={nodeAiPrompt}
                            onChange={(e) => setNodeAiPrompt(e.target.value)}
                            placeholder={`Minta AI merevisi analisa tentang "${activeAiNode?.text}"... (Contoh: "Carikan jurnal berbahasa Indonesia")`}
                            className="flex-1 bg-transparent px-4 outline-none text-sm text-slate-700"
                        />
                            <button onClick={() => handleOpenNodeAi(activeAiNode, true)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 font-bold text-sm transition-colors flex items-center gap-2">
                             <span className="icon text-sm">send</span> Revise
                            </button>
                    </div>
                </div>

            </div>
        </div>
    )}
            
            </main>



            {renderSidebar()}

            {/* Backdrop for menu */}
            {showMenu && <div className="fixed inset-0 z-40 no-export" onClick={() => setShowMenu(false)}></div>}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
