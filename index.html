            background-size: 50px 50px;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        /* Stats bar animation */
        @keyframes barGrow { from { width: 0; } to { width: var(--target-w); } }

        /* Markdown Styling untuk AI */

        .ai-markdown p { margin-bottom: 1em; line-height: 1.7; color: #475569; font-size: 0.95rem; }
        .ai-markdown ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1em; color: #475569; }
        .ai-markdown ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1em; color: #475569; }
        .ai-markdown li { margin-bottom: 0.5em; }
        .ai-markdown strong { color: #0f172a; font-weight: 800; }
        .ai-markdown em { background: #f1f5f9; padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-style: normal; color: #3b82f6; font-family: monospace; font-size: 0.85rem;}

const getCol = (type) => {
    for (const [col, types] of Object.entries(COL_TYPES)) {
        if (types.includes(type)) return parseInt(col);
    }
    return 3;
};

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
    const [lang, setLang] = useState('en');
    const [nodes, setNodes] = useState([]);

    // ── AI ANALYTICS STATES ──────────────────────────────────────────
    const [showAiConfig, setShowAiConfig] = React.useState(false);
    const [geminiKey, setGeminiKey] = React.useState(localStorage.getItem('gemini_api_key') || '');
    const [showAiAnalysis, setShowAiAnalysis] = React.useState(false);
    const [aiPage, setAiPage] = React.useState(1);
    const [isAnalyzing, setIsAnalyzing] = React.useState(false);
    const [aiFeedback, setAiFeedback] = React.useState('');
    const [aiAnalysisResult, setAiAnalysisResult] = React.useState(''); // State baru untuk hasil All Nodes

    // ── NODE AI ANALYTICS STATES ─────────────────────────────────────
    const [showNodeAiModal, setShowNodeAiModal] = React.useState(false);
    const [activeAiNode, setActiveAiNode] = React.useState(null);
    const [nodeAiTab, setNodeAiTab] = React.useState('insight');
    const [isNodeAnalyzing, setIsNodeAnalyzing] = React.useState(false);
    const [nodeAiPrompt, setNodeAiPrompt] = React.useState('');
    const [nodeAiResult, setNodeAiResult] = React.useState(''); // State baru untuk hasil Per Node

    const [edges, setEdges] = useState([]);
    const [viewMode, setViewMode] = useState('visual');
    const [visualLayout, setVisualLayout] = useState('canvas');
    const [isSidebarOpen, setIsSidebarOpen] = useState(false);
    const [sidebarTab, setSidebarTab] = useState('dict');
    const [showMenu, setShowMenu] = useState(false);
    const [isExporting, setIsExporting] = useState(false);

    const [panZoom, setPanZoom] = useState({ x: 60, y: 60, scale: 1 });
    const [isPanning, setIsPanning] = useState(false);
    const [panStart, setPanStart] = useState({ x:0, y:0 });

    const [draggingNode, setDraggingNode] = useState(null);
    const [hoveredNode, setHoveredNode] = useState(null);
    const [dragOffset, setDragOffset] = useState({ x:0, y:0 });
    const [connectingFrom, setConnectingFrom] = useState(null);
    const [filterTypes, setFilterTypes] = useState([]);
    const [searchQuery, setSearchQuery] = useState('');
    const [expandedNotes, setExpandedNotes] = useState({});
    const [selectedNodeId, setSelectedNodeId] = useState(null);

    const containerRef = useRef(null);
    const exportAreaRef = useRef(null);
    const fileInputRef = useRef(null);

    const t = (key) => T[key][lang];

    // ── stats ──
    const stats = useMemo(() => {
        const typeCounts = {};
        nodes.forEach(n => {
            typeCounts[n.type] = (typeCounts[n.type] || 0) + 1;
        });
        const connectionCounts = {};
        nodes.forEach(n => { connectionCounts[n.id] = 0; });
        edges.forEach(e => {
            connectionCounts[e.source] = (connectionCounts[e.source] || 0) + 1;
            connectionCounts[e.target] = (connectionCounts[e.target] || 0) + 1;
        });
        const topId = Object.entries(connectionCounts).sort((a,b) => b[1]-a[1])[0]?.[0];
        const topNode = nodes.find(n => n.id === topId);
        return { typeCounts, connectionCounts, topNode, topCount: topId ? connectionCounts[topId] : 0 };
    }, [nodes, edges]);

    const presentTypes = useMemo(() => [...new Set(nodes.map(n => n.type))], [nodes]);

    // ── FUNGSI AI ANALYZER (ALL NODES) ──────────────────────────────────────────
    const handleStartAnalysis = async (isRevision = false) => {
        if (!geminiKey) return alert("Please enter your Gemini API Key first.");
        
        localStorage.setItem('gemini_api_key', geminiKey);
        setShowAiConfig(false);
        setShowAiAnalysis(true);

        // JIKA SUDAH ADA HASIL & BUKAN REVISI -> JANGAN FETCH ULANG
        if (aiAnalysisResult && !isRevision) return;

        setIsAnalyzing(true);
        setAiPage(1); 
        
        try {
            const frameworkData = {
                variables: nodes.map(n => ({ name: n.text, type: n.type, notes: n.notes })),
                relationships: edges.map(e => ({
                    source: nodes.find(n => n.id === e.source)?.text,
                    target: nodes.find(n => n.id === e.target)?.text,
                    direction: e.direction,
                    label: e.label
                }))
            };

            const promptText = isRevision && aiFeedback 
                ? `Kerangka saya: ${JSON.stringify(frameworkData)}. Revisi analisa sebelumnya dengan instruksi ini: ${aiFeedback}` 
                : `Kerangka saya: ${JSON.stringify(frameworkData)}. Bertindaklah sebagai profesor pembimbing. Berikan: 1) Kekuatan struktur, 2) Kelemahan/Cacat Logika, 3) Rekomendasi Perbaikan. Gunakan Markdown (Header, List, Bold).`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || 'Failed');
            
            setAiAnalysisResult(data.candidates[0].content.parts[0].text);
            if (isRevision) setAiFeedback(''); // Bersihkan input revisi

        } catch (error) {
            setAiAnalysisResult("**Error:** Gagal memproses AI. " + error.message);
        } finally {
            setIsAnalyzing(false);
        }
    };

    
    // ── FUNGSI AI ANALYZER (PER NODE / JSON DATA) ───────────────────────────────────
    const handleOpenNodeAi = async (node, isRevision = false) => {
        if (!geminiKey) return alert("Masukkan API Key di menu atas terlebih dahulu.");

        setActiveAiNode(node);
        setShowNodeAiModal(true);
        setNodeAiTab('insight');

        // CACHE: Jika sudah ada data dan bukan revisi, langsung tampilkan
        if (node.aiData && !isRevision) return;

        setIsNodeAnalyzing(true);

        try {
            const promptText = `Anda adalah asisten peneliti ahli. Analisa variabel penelitian ini:
            Nama: "${node.text}"
            Tipe: "${node.type}"
            Catatan: "${node.notes || '-'}"
            
            ${isRevision && nodeAiPrompt ? `REVISI DENGAN INSTRUKSI INI: ${nodeAiPrompt}\n\n` : ''}
            KEMBALIKAN HANYA VALID JSON dengan struktur berikut (pastikan valid JSON, tanpa backtick markdown di awal/akhir):
            {
              "insight": "Teks Markdown detail yang memuat: 1. Definisi Teoritis, 2. Metrik Pengukuran, 3. Potensi Bias",
              "scholar_paper": "Satu judul jurnal akademik asli paling relevan untuk variabel ini",
              "scholar_author": "Nama Penulis (Tahun)",
              "pubmed_paper": "Satu judul paper medis/psikologis/sains asli yang relevan",
              "pubmed_author": "Nama Penulis (Tahun)",
              "youtube_query": "Kata kunci pencarian youtube spesifik (contoh: 'behavioral economics explained')"
            }`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || 'Failed');
            
            // Membersihkan backtick ```json jika AI masih membandel mengirimkannya
            let resultText = data.candidates[0].content.parts[0].text;
            resultText = resultText.replace(/```json/gi, '').replace(/```/g, '').trim();
            
            const aiData = JSON.parse(resultText); // Ubah teks AI jadi Object Data
            
            // Simpan data AI ke dalam Node agar otomatis ke-save saat di Export
            updateNode(node.id, 'aiData', aiData);
            if (isRevision) setNodeAiPrompt('');

        } catch (error) {
            console.error(error);
            alert("Gagal memproses AI. Hal ini biasanya terjadi karena AI gagal membuat format JSON yang valid. Coba klik Revise lagi.");
        } finally {
            setIsNodeAnalyzing(false);
        }
    };

    const handleApplyRecommendation = () => {
        alert("Fungsi auto-apply sedang dalam pengembangan.");
    };

// ... (Simpan seluruh fungsi handle ekspor, zoom, drag, getPositions seperti sebelumnya, JANGAN DIHAPUS) ...

    // [BAGIAN MODAL YANG DIUBAH DI DALAM render() BAWAH]
    // Cari bagian {showAiAnalysis && (...)} dan ganti isinya dengan ini:

    const handleAddRecommendedNode = (type, title, category) => {
        alert(`Sistem akan menambahkan node "${title}" (${category}) ke canvas dan otomatis menghubungkannya ke ${activeAiNode.text}.`);
        // Logika pembuatan node baru akan diletakkan di sini nantinya
    };

    // ── export PNG ──
    const handleExportPNG = async () => {
        if (!exportAreaRef.current) return;
        setIsExporting(true); setShowMenu(false);
        setTimeout(async () => {
            try {
                const canvas = await html2canvas(exportAreaRef.current, {
                    backgroundColor: visualLayout === 'framework' ? '#020617' : '#f8fafc',
                    scale: 2, useCORS: true, logging: false
                });
                const link = document.createElement('a');
                link.download = `Framework_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch(err) { console.error(err); }
            setIsExporting(false);
        }, 100);
    };

    // ── json ──
    const handleExportJSON = () => {
        const blob = new Blob([JSON.stringify({ nodes, edges }, null, 2)], { type:'application/json' });
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `Scenario_${Date.now()}.json` });
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setShowMenu(false);
    };
    const handleImportJSON = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const p = JSON.parse(ev.target.result);
                if (p.nodes && p.edges) { setNodes(p.nodes); setEdges(p.edges); setPanZoom({x:60,y:60,scale:1}); }
                else alert('Invalid JSON format.');
            } catch { alert('Failed to read JSON.'); }
        };
        reader.readAsText(file);
        setShowMenu(false);
        if (fileInputRef.current) fileInputRef.current.value='';
    };

    // ── pan zoom ──
    const handleWheel = (e) => {
        if (viewMode !== 'visual') return;
        e.preventDefault();
        const scaleAdj = e.deltaY > 0 ? 0.9 : 1.1;
        setPanZoom(prev => ({ ...prev, scale: Math.max(0.15, Math.min(prev.scale * scaleAdj, 3)) }));
    };
    const handleBgPointerDown = (e) => {
        if (connectingFrom) { setConnectingFrom(null); return; }
        setIsPanning(true);
        setPanStart({ x: e.clientX - panZoom.x, y: e.clientY - panZoom.y });
    };
    const handleNodePointerDown = (e, nodeId) => {
        e.stopPropagation();
        setSelectedNodeId(nodeId); 
        setSidebarTab('edit'); 
        setIsSidebarOpen(true);
        if (visualLayout === 'framework' || connectingFrom) return;
        const node = nodes.find(n => n.id === nodeId);
        setDraggingNode(nodeId);
        const rect = containerRef.current.getBoundingClientRect();
        setDragOffset({
            x: (e.clientX - rect.left - panZoom.x) / panZoom.scale - node.x,
            y: (e.clientY - rect.top  - panZoom.y) / panZoom.scale - node.y,
        });
    };
    const handlePointerMove = useCallback((e) => {
        if (isPanning) {
            setPanZoom(prev => ({ ...prev, x: e.clientX - panStart.x, y: e.clientY - panStart.y }));
            return;
        }
        if (draggingNode && visualLayout === 'canvas') {
            const rect = containerRef.current.getBoundingClientRect();
            const mx = (e.clientX - rect.left - panZoom.x) / panZoom.scale;
            const my = (e.clientY - rect.top  - panZoom.y) / panZoom.scale;
            setNodes(prev => prev.map(n => n.id === draggingNode ? { ...n, x: mx - dragOffset.x, y: my - dragOffset.y } : n));
        }
    }, [isPanning, draggingNode, visualLayout, panStart, dragOffset]);
    const handlePointerUp = () => { setIsPanning(false); setDraggingNode(null); };
    useEffect(() => {
        if (isPanning || draggingNode) {
            window.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('mouseup', handlePointerUp);
        }
        return () => { window.removeEventListener('mousemove', handlePointerMove); window.removeEventListener('mouseup', handlePointerUp); };
    }, [isPanning, draggingNode, handlePointerMove]);

    // ── data ops ──
    const loadSample = (key) => { setNodes(SAMPLES[key].nodes); setEdges(SAMPLES[key].edges); setPanZoom({x:120,y:60,scale:0.85}); setShowMenu(false); };
    const clearData  = () => { if(window.confirm(t('confirmClear'))) { setNodes([]); setEdges([]); setPanZoom({x:60,y:60,scale:1}); } setShowMenu(false); };
    const addNode    = () => {
        setNodes(prev => [...prev, { id: Date.now().toString(), text:'', type:'independent', x:(-panZoom.x+300)/panZoom.scale, y:(-panZoom.y+200)/panZoom.scale, notes:'' }]);
        if (viewMode==='visual' && visualLayout==='framework') setVisualLayout('canvas');
    };
    const deleteNode = (id) => { setNodes(n => n.filter(n => n.id !== id)); setEdges(e => e.filter(e => e.source !== id && e.target !== id)); };
    const updateNode = (id, field, val) => setNodes(n => n.map(n => n.id===id ? {...n,[field]:val} : n));
    const addEdge    = () => { if (nodes.length < 2) return; setEdges(e => [...e, { id: Date.now().toString(), source: nodes[0].id, target: nodes[1].id, label:'', direction:'neutral' }]); };
    const updateEdge = (id, field, val) => setEdges(e => e.map(e => e.id===id ? {...e,[field]:val} : e));
    const handleVisualConnect = (nodeId) => {
        if (!connectingFrom) { setConnectingFrom(nodeId); return; }
        if (connectingFrom !== nodeId && !edges.find(e => e.source===connectingFrom && e.target===nodeId)) {
            setEdges(e => [...e, { id:`e-${Date.now()}`, source:connectingFrom, target:nodeId, label:'', direction:'neutral' }]);
        }
        setConnectingFrom(null);
    };

    // ── layout ──
    const getPositions = (spacing) => {
        const cols = [[], [], [], []];
        nodes.forEach(n => { const c = getCol(n.type); cols[c].push(n); });
        const positions = {};
        const maxH = Math.max(...cols.map(c => c.length));
        cols.forEach((col, ci) => {
            const colH = col.length * spacing.y;
            const startY = 150 + (maxH * spacing.y - colH) / 2;
            col.forEach((n, i) => { positions[n.id] = { x: 60 + ci * spacing.x, y: startY + i * spacing.y }; });
        });
        return positions;
    };
    const getFrameworkPositions = () => getPositions({ x:380, y:150 });
    const handleAutoArrange = () => {
        const positions = getPositions({ x:440, y:210 });
        setNodes(prev => prev.map(n => ({ ...n, x: positions[n.id]?.x ?? n.x, y: positions[n.id]?.y ?? n.y })));
        const cols = [[], [], [], []];
        nodes.forEach(n => cols[getCol(n.type)].push(n));
        const maxH = Math.max(...cols.map(c => c.length));
        setPanZoom({ x: 40, y: 40, scale: Math.min(1, 700 / (maxH * 210 + 200)) });
    };

    // ── next hypothesis number ──
    const nextHypNum = () => {
        const hypEdges = edges.filter(e => e.direction === 'hypothesis');
        return `H${hypEdges.length + 1}`;
    };

    // ─ RENDER: INPUT MODE ──────────────────────────────────────────────────────
    const renderInputMode = () => {
        const filtered = nodes.filter(n => !searchQuery || n.text.toLowerCase().includes(searchQuery.toLowerCase()));
        return (
            <div className="flex-1 overflow-y-auto bg-slate-50 p-6">
                <div className="max-w-5xl mx-auto space-y-6">

                    {/* Variable list */}
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="px-6 py-4 border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white flex flex-wrap justify-between items-center gap-3">
                            <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                <span className="icon icon-sm text-indigo-500">view_list</span> {t('varList')}
                                <span className="text-xs font-semibold text-slate-400 bg-slate-100 rounded-full px-2 py-0.5 ml-1">{nodes.length}</span>
                            </h2>
                            <div className="flex items-center gap-2 flex-wrap">
                                <div className="relative">
                                    <span className="icon icon-sm text-slate-400 absolute left-3 top-1/2 -translate-y-1/2">search</span>
                                    <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                                        placeholder={t('searchVars')}
                                        className="pl-9 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg bg-white outline-none focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 w-48" />
                                </div>
                                <button onClick={addNode} className="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition-colors">
                                    <span className="icon icon-sm">add</span> {t('addNode')}
                                </button>
                            </div>
                        </div>
                        <div className="p-5 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                            {filtered.map(node => {
                                const style = VAR_TYPES[node.type] || VAR_TYPES.independent;
                                const lc = style.lc.split(' ');
                                const notesExpanded = expandedNotes[node.id];
                                return (
                                    <div key={node.id} className={`rounded-xl border-2 flex flex-col relative group node-enter transition-shadow ${style.lc} hover:shadow-md`}>
                                        <div className="p-4 flex flex-col gap-2.5">
                                            <div className="flex items-start justify-between gap-2">
                                                <select value={node.type} onChange={e => updateNode(node.id,'type',e.target.value)}
                                                    className="text-[10px] font-bold uppercase tracking-wider bg-white/60 border-none outline-none rounded-md px-1.5 py-1 flex-1 min-w-0 cursor-pointer">
                                                    {['basic','advanced','stat'].map(cat => (
                                                        <optgroup key={cat} label={cat === 'basic' ? '── BASIC' : cat === 'advanced' ? '── ADVANCED' : '── STATISTICAL'}>
                                                            {Object.entries(VAR_TYPES).filter(([,v]) => v.cat === cat).map(([k,v]) => (
                                                                <option key={k} value={k}>{v[lang]}</option>
                                                            ))}
                                                        </optgroup>
                                                    ))}
                                                </select>
                                                <button onClick={() => deleteNode(node.id)} className="p-1 text-slate-300 hover:text-red-400 hover:bg-red-50 rounded-lg transition-colors shrink-0">
                                                    <span className="icon icon-xs">delete</span>
                                                </button>
                                            </div>

                                           <textarea value={node.text} onChange={e => updateNode(node.id,'text',e.target.value)}
                                                placeholder={t('typeVar')}
                                                className="w-full bg-white/60 focus:bg-white border-none rounded-lg px-2.5 py-2 text-sm font-semibold text-slate-800 outline-none resize-none h-16 placeholder-slate-300 focus:ring-1 focus:ring-white/80 transition-all" />
                                        </div>
                                        <div className="px-4 pb-3">
                                            <button onClick={() => setExpandedNotes(e => ({...e,[node.id]:!e[node.id]}))}
                                                className="text-[11px] flex items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
                                                <span className="icon icon-xs">{notesExpanded ? 'expand_less' : 'expand_more'}</span>
                                                Notes {node.notes ? '●' : ''}
                                            </button>
                                            {notesExpanded && (
                                                <textarea value={node.notes || ''} onChange={e => updateNode(node.id,'notes',e.target.value)}
                                                    placeholder={t('notes')}
                                                    className="mt-1.5 w-full bg-white/60 border-none rounded-lg px-2.5 py-2 text-xs text-slate-600 outline-none resize-none h-14 placeholder-slate-300" />
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                            {nodes.length === 0 && (
                                <div className="col-span-full flex flex-col items-center justify-center py-16 text-slate-400">
                                    <span className="icon text-slate-200 mb-3" style={{fontSize:'48px'}}>view_list</span>
                                    <p className="text-sm">{t('emptyNodes')}</p>
                                    <button onClick={addNode} className="mt-4 px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-sm font-bold transition-colors">{t('createFirst')}</button>
                                </div>
                            )}
                            {filtered.length === 0 && nodes.length > 0 && (
                                <div className="col-span-full text-center py-8 text-slate-400 text-sm">No variables match "{searchQuery}"</div>
                            )}
                        </div>
                    </div>

                    {/* Relationships */}
                    {nodes.length > 0 && (
                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="px-6 py-4 border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white flex justify-between items-center">
                                <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                    <span className="icon icon-sm text-indigo-500">route</span> {t('relations')}
                                    <span className="text-xs font-semibold text-slate-400 bg-slate-100 rounded-full px-2 py-0.5 ml-1">{edges.length}</span>
                                </h2>
                                <button onClick={addEdge} className="flex items-center gap-1.5 px-3 py-1.5 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-lg text-sm font-semibold transition-colors">
                                    <span className="icon icon-sm">add</span> {t('addEdge')}
                                </button>
                            </div>
                            <div className="p-5 space-y-2.5">
                                {edges.map((edge, idx) => {
                                    const dir = EDGE_DIRECTIONS[edge.direction || 'neutral'];
                                    const hypCount = edges.slice(0, idx).filter(e => e.direction === 'hypothesis').length + 1;
                                    return (
                                        <div key={edge.id} className="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 p-3 rounded-xl">
                                            <select value={edge.source} onChange={e => updateEdge(edge.id,'source',e.target.value)}
                                                className="flex-1 min-w-[100px] bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-medium outline-none">
                                                {nodes.map(n => <option key={n.id} value={n.id}>{n.text || '(Empty)'}</option>)}
                                            </select>
                                            <div className="flex items-center gap-1.5">
                                                <div className="w-3 h-3 rounded-full border-2" style={{borderColor: dir.hex, backgroundColor: dir.hex + '30'}}></div>
                                                <select value={edge.direction || 'neutral'} onChange={e => updateEdge(edge.id,'direction',e.target.value)}
                                                    className="text-[10px] font-bold border border-slate-200 rounded-lg px-2 py-1.5 outline-none bg-white" style={{color: dir.hex}}>
                                                    {Object.keys(EDGE_DIRECTIONS).map(d => <option key={d} value={d}>{t('edgeDir_'+d)}</option>)}
                                                </select>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                <input value={edge.label} onChange={e => updateEdge(edge.id,'label',e.target.value)}
                                                    placeholder={t('relationType')}
                                                    className="w-32 text-center text-xs bg-white border border-slate-200 rounded-full px-2.5 py-1.5 outline-none" />
                                                {edge.direction === 'hypothesis' && (
                                                    <button onClick={() => updateEdge(edge.id,'label',`H${hypCount}: ${edge.label.replace(/^H\d+:\s*/,'')}`)}
                                                        className="text-[10px] font-bold px-2 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg border border-indigo-200 shrink-0 transition-colors">
                                                        {t('genHyp')}
                                                    </button>
                                                )}
                                            </div>
                                            <select value={edge.target} onChange={e => updateEdge(edge.id,'target',e.target.value)}
                                                className="flex-1 min-w-[100px] bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-medium outline-none">
                                                {nodes.map(n => <option key={n.id} value={n.id}>{n.text || '(Empty)'}</option>)}
                                            </select>
                                            <button onClick={() => setEdges(e => e.filter(e => e.id !== edge.id))}
                                                className="p-1.5 text-slate-400 hover:text-red-400 hover:bg-red-50 rounded-lg transition-colors">
                                                <span className="icon icon-xs">delete</span>
                                            </button>
                                        </div>
                                    );
                                })}
                                {edges.length === 0 && <div className="text-center py-6 text-slate-400 text-sm">{t('emptyEdges')}</div>}
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    // ─ RENDER: VISUAL MODE ─────────────────────────────────────────────────────
    const renderVisualMode = () => {
        const isFramework = visualLayout === 'framework';
        const fpos = isFramework ? getFrameworkPositions() : {};

        return (
            <div className={`flex-1 relative overflow-hidden flex flex-col ${isFramework ? 'bg-slate-950' : 'bg-slate-50'}`}>

                {/* Type filter bar */}
                {nodes.length > 0 && presentTypes.length > 1 && (
                    <div className={`flex items-center gap-2 px-4 py-2 border-b overflow-x-auto shrink-0 no-export z-30 ${isFramework ? 'bg-slate-900/80 border-slate-800 backdrop-blur' : 'bg-white/90 border-slate-200 backdrop-blur'}`}>
                        <span className={`text-[10px] font-bold uppercase tracking-widest shrink-0 ${isFramework ? 'text-slate-500' : 'text-slate-400'}`}>{t('filterType')}</span>
                        <button onClick={() => setFilterTypes([])}
                            className={`shrink-0 px-3 py-1 rounded-full text-[11px] font-bold border transition-all ${filterTypes.length === 0 ? (isFramework ? 'bg-slate-700 text-white border-slate-600' : 'bg-slate-800 text-white border-slate-800') : (isFramework ? 'text-slate-400 border-slate-700 hover:bg-slate-800' : 'text-slate-500 border-slate-200 hover:bg-slate-100')}`}>
                            {t('clearFilter')}
                        </button>
                        {presentTypes.map(type => {
                            const info = VAR_TYPES[type];
                            if (!info) return null;
                            const isActive = filterTypes.includes(type);
                            const theme = neonThemes[info.neon];
                            return (
                                <button key={type} onClick={() => setFilterTypes(f => f.includes(type) ? f.filter(x=>x!==type) : [...f,type])}
                                    className={`shrink-0 flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold border transition-all`}
                                    style={{ backgroundColor: isActive ? theme.hex + '20' : 'transparent', borderColor: isActive ? theme.hex : (isFramework ? '#334155' : '#e2e8f0'), color: isActive ? theme.hex : (isFramework ? '#64748b' : '#94a3b8') }}>
                                    <span className="w-1.5 h-1.5 rounded-full" style={{backgroundColor: theme.hex}}></span>
                                    {info[lang]}
                                </button>
                            );
                        })}
                    </div>
                )}

                {/* Canvas area */}
                <div className="flex-1 relative overflow-hidden"
                     ref={exportAreaRef}
                     onWheel={handleWheel}
                     onPointerDown={handleBgPointerDown}
                     style={{ cursor: isPanning ? 'grabbing' : 'grab' }}>

                    {isFramework ? (
                        <>
                            <div className="absolute inset-0 bg-cyber-grid pointer-events-none opacity-40"></div>
                            <div className="scanline no-export"></div>
                        </>
                    ) : (
                        <div className="absolute inset-0 pointer-events-none opacity-30"
                             style={{ backgroundImage:'radial-gradient(#94a3b8 1.5px, transparent 1.5px)', backgroundSize:`${22*panZoom.scale}px ${22*panZoom.scale}px`, backgroundPosition:`${panZoom.x}px ${panZoom.y}px` }}>
                        </div>
                    )}

                    <svg className="absolute w-0 h-0">
                        <defs>
                            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="3" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                        </defs>
                    </svg>

                    <div ref={containerRef}
                         className="absolute inset-0 w-full h-full"
                         style={{ transform:`translate(${panZoom.x}px,${panZoom.y}px) scale(${panZoom.scale})`, transformOrigin:'0 0' }}>

                        <svg className="absolute inset-0 overflow-visible" style={{zIndex:0}}>
                            <defs>
                                {Object.entries(EDGE_DIRECTIONS).map(([key, dir]) => (
                                    <React.Fragment key={key}>
                                        <marker id={`arrow-${key}`} viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                                            <path d="M 0 0 L 10 5 L 0 10 z" fill={isFramework ? dir.darkHex : dir.hex}/>
                                        </marker>
                                        <marker id={`arrow-${key}-start`} viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                                            <path d="M 0 0 L 10 5 L 0 10 z" fill={isFramework ? dir.darkHex : dir.hex}/>
                                        </marker>
                                    </React.Fragment>
                                ))}
                            </defs>

                            {edges.map(edge => {
                                const src = nodes.find(n => n.id===edge.source);
                                const tgt = nodes.find(n => n.id===edge.target);
                                if (!src || !tgt) return null;

                                const sRX = isFramework ? (fpos[src.id]?.x ?? src.x) : src.x;
                                const sRY = isFramework ? (fpos[src.id]?.y ?? src.y) : src.y;
                                const tRX = isFramework ? (fpos[tgt.id]?.x ?? tgt.x) : tgt.x;
                                const tRY = isFramework ? (fpos[tgt.id]?.y ?? tgt.y) : tgt.y;

                                const direction = edge.direction || 'neutral';
                                const dir = EDGE_DIRECTIONS[direction];
                                const strokeColor = isFramework ? dir.darkHex : dir.hex;

                                let sX, sY, tX, tY, d, labelX, labelY;
                                if (isFramework) {
                                    sX = sRX + 250; sY = sRY + 55;
                                    tX = tRX;       tY = tRY + 55;
                                    const isSameCol = sRX === tRX;
                                    const isBwd = sRX > tRX;
                                    if (isSameCol) {
                                        d = `M ${sX} ${sY} C ${sX+90} ${sY}, ${sX+90} ${tY}, ${sX} ${tY}`;
                                        labelX = sX+60; labelY = (sY+tY)/2;
                                    } else if (isBwd) {
                                        d = `M ${sX} ${sY} C ${sX+90} ${sY+160}, ${tX-90} ${tY+160}, ${tX} ${tY}`;
                                        labelX = (sX+tX)/2; labelY = (sY+tY)/2+100;
                                    } else {
                                        d = `M ${sX} ${sY} C ${sX+110} ${sY}, ${tX-110} ${tY}, ${tX} ${tY}`;
                                        labelX = (sX+tX)/2; labelY = (sY+tY)/2;
                                    }
                                } else {
                                    const dx = tRX - sRX, dy = tRY - sRY;
                                    if (Math.abs(dx) >= Math.abs(dy)) {
                                        if (dx >= 0) { sX=sRX+260; sY=sRY+55; tX=tRX; tY=tRY+55; d=`M ${sX} ${sY} C ${sX+80} ${sY}, ${tX-80} ${tY}, ${tX} ${tY}`; }
                                        else         { sX=sRX; sY=sRY+55; tX=tRX+260; tY=tRY+55; d=`M ${sX} ${sY} C ${sX-80} ${sY}, ${tX+80} ${tY}, ${tX} ${tY}`; }
                                    } else {
                                        if (dy >= 0) { sX=sRX+130; sY=sRY+120; tX=tRX+130; tY=tRY; d=`M ${sX} ${sY} C ${sX} ${sY+70}, ${tX} ${tY-70}, ${tX} ${tY}`; }
                                        else         { sX=sRX+130; sY=sRY; tX=tRX+130; tY=tRY+120; d=`M ${sX} ${sY} C ${sX} ${sY-70}, ${tX} ${tY+70}, ${tX} ${tY}`; }
                                    }
                                    labelX = (sX+tX)/2; labelY = (sY+tY)/2;
                                }

                                const isVisible = filterTypes.length === 0 || filterTypes.includes(src.type) || filterTypes.includes(tgt.type);
                                const isFocused = isFramework && (!hoveredNode || edge.source===hoveredNode || edge.target===hoveredNode);
                                const opacity = (!isVisible) ? 0.05 : (isFramework && !isFocused ? 0.15 : 1);

                                const isBi = direction === 'bidirectional';
                                const strokeW = (isFramework && isFocused) ? '2.5' : '1.8';

                                return (
                                    <g key={edge.id} style={{ opacity, transition:'opacity 0.3s' }}>
                                        <path id={`path-${edge.id}`} d={d} fill="none"
                                            stroke={strokeColor} strokeWidth={strokeW}
                                            markerEnd={`url(#arrow-${direction})`}
                                            markerStart={isBi ? `url(#arrow-${direction}-start)` : undefined}
                                            strokeDasharray={direction==='hypothesis' ? '6 3' : undefined}
                                            style={isFramework && isFocused ? { filter:`drop-shadow(0 0 4px ${strokeColor})` } : {}} />

                                        {isFramework && isFocused && (
                                            <circle r="3.5" fill="white" filter="url(#glow)" className="no-export">
                                                <animateMotion dur="2.5s" repeatCount="indefinite"><mpath href={`#path-${edge.id}`}/></animateMotion>
                                            </circle>
                                        )}

                                        <foreignObject x={labelX-65} y={labelY-14} width="130" height="28" className="overflow-visible" style={{zIndex:10}}>
                                            <div className={`flex items-center justify-center rounded-full text-[9px] font-bold px-2.5 py-1 w-max mx-auto border transition-all ${isFramework ? 'bg-slate-950/80 backdrop-blur' : 'bg-white/95 backdrop-blur border-slate-200/80'}`}
                                                 style={isFramework ? { borderColor: isFocused ? strokeColor : '#1e293b', color: isFocused ? '#fff' : '#475569', boxShadow: isFocused ? `0 0 8px ${strokeColor}50` : 'none' } : { color: strokeColor, borderColor: strokeColor+'60', boxShadow: `0 1px 6px ${strokeColor}20` }}>
                                                {dir.symbol && <span className="mr-1 font-black">{dir.symbol}</span>}
                                                <input value={edge.label} onChange={e => updateEdge(edge.id,'label',e.target.value)}
                                                    className="bg-transparent border-none text-center outline-none min-w-[40px] max-w-[80px]"
                                                    placeholder="Label" onPointerDown={e => e.stopPropagation()} />
                                            </div>
                                        </foreignObject>
                                    </g>
                                );
                            })}
                        </svg>

                        {nodes.map(node => {
                            const info = VAR_TYPES[node.type] || VAR_TYPES.independent;
                            const theme = neonThemes[info.neon];
                            const rX = isFramework ? (fpos[node.id]?.x ?? node.x) : node.x;
                            const rY = isFramework ? (fpos[node.id]?.y ?? node.y) : node.y;
                            const isHov = hoveredNode === node.id;
                            const isConnSrc = connectingFrom === node.id;
                            const isConnTgt = connectingFrom && connectingFrom !== node.id;
                            const isVisible = filterTypes.length === 0 || filterTypes.includes(node.type);
                            const isFwd = isFramework && (!hoveredNode || hoveredNode === node.id || edges.some(e => (e.source===hoveredNode&&e.target===node.id)||(e.target===hoveredNode&&e.source===node.id)));
                            const opacity = !isVisible ? 0.06 : (isFramework && !isFwd ? 0.18 : 1);

                            return (
                                <div key={node.id}
                                     onMouseEnter={() => isFramework && setHoveredNode(node.id)}
                                     onMouseLeave={() => isFramework && setHoveredNode(null)}
                                     onPointerDown={e => e.stopPropagation()}
                                     className={`absolute w-[260px] rounded-xl transition-all duration-250 z-10
                                         ${isFramework
                                             ? `border p-4 bg-slate-900/50 backdrop-blur-xl ${isHov ? `${theme.border} ${theme.glow} scale-[1.03] z-40` : 'border-slate-700/60'}`
                                             : `glass-node border border-slate-200/80 shadow-md ${isConnTgt ? 'ring-2 ring-amber-400 animate-pulse' : 'hover:shadow-lg'} ${isConnSrc ? 'ring-2 ring-indigo-400' : ''}`
                                         }`}
                                     style={{ left: rX||0, top: rY||0, opacity, transition: 'opacity 0.25s, transform 0.2s, box-shadow 0.2s' }}>

                                    {/* Freeform drag handle */}
                                    {!isFramework && (
                                        <div className={`h-2.5 w-full rounded-t-xl cursor-grab active:cursor-grabbing flex items-center justify-center`}
                                             style={{ backgroundColor: theme.hex + 'cc' }}
                                             onPointerDown={e => handleNodePointerDown(e, node.id)}>
                                        </div>
                                    )}

                                    {/* Framework corner accents */}
                                    {isFramework && (
                                        <>
                                            <div className={`absolute top-0 left-0 w-2.5 h-2.5 border-t-2 border-l-2 rounded-tl-lg transition-colors ${isHov ? theme.border : 'border-slate-600'}`}></div>
                                            <div className={`absolute bottom-0 right-0 w-2.5 h-2.5 border-b-2 border-r-2 rounded-br-lg transition-colors ${isHov ? theme.border : 'border-slate-600'}`}></div>
                                            <div className="absolute top-1/2 -left-1 w-1.5 h-5 -mt-2.5 rounded-sm" style={{ backgroundColor: isFwd ? theme.hex : '#334155', boxShadow: isFwd ? `0 0 6px ${theme.hex}` : 'none', transition:'all 0.3s' }}></div>
                                            <div className="absolute top-1/2 -right-1 w-1.5 h-5 -mt-2.5 rounded-sm" style={{ backgroundColor: isFwd ? theme.hex : '#334155', boxShadow: isFwd ? `0 0 6px ${theme.hex}` : 'none', transition:'all 0.3s' }}></div>
                                        </>
                                    )}

                                    <div className={!isFramework ? 'px-4 pt-3 pb-2' : ''}>
                                        {/* Type badge */}
                                        <div className={`text-[9px] font-black uppercase tracking-widest mb-2.5 flex items-center gap-1.5`}
                                             style={{ color: isFramework ? theme.hex : undefined }}>
                                            {isFramework
                                                ? <><span className="w-1.5 h-1.5 rounded-full" style={{backgroundColor:theme.hex, boxShadow:`0 0 5px ${theme.hex}`}}></span> {info[lang]}</>
                                                : <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-md border text-[9px] font-bold uppercase tracking-wider ${info.lc}`}>{info[lang]}</span>
                                            }
                                        </div>
                                        {/* Text */}
                                        <textarea value={node.text} onChange={e => updateNode(node.id,'text',e.target.value)}
                                            className={`w-full text-[14px] font-bold bg-transparent border-none outline-none resize-none placeholder-slate-300 leading-snug ${isFramework ? 'text-white' : 'text-slate-800'}`}
                                            rows="2" placeholder={t('typeVar')} />
                                        {/* Notes preview */}
                                        {node.notes && (
